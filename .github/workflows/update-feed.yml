name: Update positive news feed

on:
  schedule:
    # 05:00 and 15:00 UTC ≈ morning/evening in Finland & Estonia (EET/EEST)
    - cron: "0 5 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and compile feed
        run: python scripts/fetch_feed.py

      - name: Commit updated feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update feed data"
            git push
          fi
